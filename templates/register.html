{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 450px; margin: 2rem auto;">
    <h1>📝 Register</h1>
    <form method="post">
        <label>Username</label>
        <input type="text" name="username" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
    </form>
    <p style="margin-top: 1rem; text-align: center;">Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
</div>
{% endblock %}
