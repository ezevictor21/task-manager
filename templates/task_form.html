{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>{{ 'Edit Task' if task else 'Add New Task' }}</h1>
    <form method="post">
        <label>Title *</label>
        <input type="text" name="title" required value="{{ task.title if task else '' }}">

        <label>Description</label>
        <textarea name="description" rows="4">{{ task.description if task else '' }}</textarea>

        <label>Due Date</label>
        <input type="date" name="due_date" value="{{ task.due_date.isoformat() if task and task.due_date else '' }}">

        <label>Priority</label>
        <select name="priority">
            <option value="Low" {% if task and task.priority=='Low' %}selected{% endif %}>Low</option>
            <option value="Medium" {% if not task or task.priority=='Medium' %}selected{% endif %}>Medium</option>
            <option value="High" {% if task and task.priority=='High' %}selected{% endif %}>High</option>
        </select>

        <label>Status</label>
        <select name="status">
            <option value="Pending" {% if not task or task.status=='Pending' %}selected{% endif %}>Pending</option>
            <option value="In Progress" {% if task and task.status=='In Progress' %}selected{% endif %}>In Progress</option>
            <option value="Completed" {% if task and task.status=='Completed' %}selected{% endif %}>Completed</option>
        </select>

        <button type="submit" class="btn btn-primary">💾 {{ 'Update Task' if task else 'Create Task' }}</button>
        <a href="{{ url_for('dashboard') }}" class="btn">Cancel</a>
    </form>
</div>
{% endblock %}
