{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 450px; margin: 2rem auto;">
    <h1>🔑 Reset Password</h1>
    <form method="post">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>New Password</label>
        <input type="password" name="new_password" required>

        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Reset Password</button>
    </form>

    <p style="margin-top: 1rem; text-align: center;">
        Remembered your password? <a href="{{ url_for('login') }}">Login here</a>
    </p>
</div>
{% endblock %}
